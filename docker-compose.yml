services:
  db:
    image: postgres:13
    container_name: jwt-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: gotest
    ports:
      - "5432:5432"
    volumes:
      - go_task:/var/lib/postgresql/data
    networks:
      - jwt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gotest"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-file-analyzer
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: 123456
      DB_NAME: gotest
    networks:
      - jwt-network

volumes:
  go_task:

networks:
  jwt-network:
    driver: bridge