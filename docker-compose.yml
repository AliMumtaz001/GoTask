# version: '3.8'

services:
  db:
    image: postgres:13
    container_name: jwt-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: gotest
    ports:
      - "5432:5432"
    volumes:
        - go_task:/var/lib/postgresql/data  
    networks:
      - jwt-network

  app:
    build:
      context: .
      dockerfile: DockerFile
    container_name: auth-file-analyzer
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: 123456
      DB_NAME: gotest
    # volumes:
    #   - ./Dummy_text.txt:/jwt-auth-app/Dummy_text.txt
    networks:
      - jwt-network

volumes:
  go_task:


networks:
  jwt-network: